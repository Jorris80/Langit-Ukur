<style>
/* LangitUkur — tema dinamis (CSS variables). Preset: aero, emerald, sunset, graphite, ocean; mode terang/gelap */
:root{--pri:#0f3d5e;--pri2:#1d6fa5;--acc:#38bdf8;--bg:#f3f6fa;--bg2:#e8eef5;--card:#ffffff;--tx:#14212e;--mut:#64748b;--line:#dde5ee;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;

[data-theme=sunset]{--pri:#3b2416;--pri2:#c2410c;--acc:#fbbf24}
[data-theme=graphite]{--pri:#1f2433;--pri2:#5b5bd6;--acc:#a78bfa}

*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}

.hide{display:none!important}.muted{color:var(--mut)}.sm{font-size:12px}.b{font-weight:700}.right{text-align:right}.nowrap{white-space:nowrap}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.mt{margin-top:12px}.mb{margin-bottom:12px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---- shell ---- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(110deg,var(--pri),var(--pri2));color:#fff;z-index:40;box-shadow:0 2px 14px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top)}

.top .logo img{width:100%;height:100%;object-fit:contain}.brand{min-width:0}.brand .t{font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}.brand .s{font-size:11px;opacity:.82;white-space:nowrap}
.top .ib{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;position:relative}
.top .ib:hover{background:rgba(255,255,255,.22)}.dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;font-size:10px;display:grid;place-items:center;padding:0 3px}
.psel{max-width:240px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 10px}.psel option{color:#111}

.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--tx);text-decoration:none;font-weight:500}
.nv:hover{background:var(--bg2)}.nv.on{background:linear-gradient(90deg,color-mix(in srgb,var(--pri2) 16%,transparent),transparent);color:var(--pri2);font-weight:700;box-shadow:inset 3px 0 0 var(--pri2)}
.main{margin-left:var(--side);padding:calc(var(--top) + 18px) 22px 90px;min-height:100vh}

.bnav{display:none}

.kpi{position:relative;overflow:hidden}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}.kpi .l{color:var(--mut);font-size:12px}.kpi .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri2) 12%,transparent);color:var(--pri2)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;transition:transform .05s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--pri2);border-color:var(--pri2);color:#fff}.btn.d{color:var(--bad)}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}.btn.s{padding:5px 9px;font-size:12px}.btn[disabled]{opacity:.5;pointer-events:none}

.c-ok{background:#dcfce7;color:#166534}.c-warn{background:#fef3c7;color:#92400e}.c-bad{background:#fee2e2;color:#991b1b}.c-info{background:#dbeafe;color:#1e40af}
[data-mode=dark] .c-ok{background:#14532d;color:#bbf7d0}[data-mode=dark] .c-warn{background:#78350f;color:#fde68a}[data-mode=dark] .c-bad{background:#7f1d1d;color:#fecaca}[data-mode=dark] .c-info{background:#1e3a8a;color:#bfdbfe}

label.f{display:block}label.f span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}label.f span em{color:var(--bad);font-style:normal}

.al{display:flex;gap:9px;padding:9px 11px;border-radius:10px;margin-bottom:7px;font-size:13px;border:1px solid var(--line)}.al.danger{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}.al.warn{background:#fffbeb;border-color:#fde68a;color:#78350f}.al.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.al.ok{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
[data-mode=dark] .al.danger{background:#2a1215;border-color:#7f1d1d;color:#fecaca}[data-mode=dark] .al.warn{background:#2a1f0c;border-color:#78350f;color:#fde68a}[data-mode=dark] .al.info{background:#0f1d3a;border-color:#1e3a8a;color:#bfdbfe}[data-mode=dark] .al.ok{background:#0c2416;border-color:#14532d;color:#bbf7d0}
/* ---- modal / sheet ---- */
.mw{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(5,12,24,.5);padding:16px;animation:fd .12s}
.md{background:var(--card);border-radius:18px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:up .16s ease}.md.wide{width:min(1100px,100%)}

.lp-title{text-align:center}.lp-title .t1{font-weight:700;font-size:4.6mm;line-height:1.2;text-transform:uppercase}.lp-title .t2{font-size:3mm;margin-top:1mm}.lp-A4 .lp-title .t1{font-size:3.6mm}

/* ==========================================================================
 * CALC — fungsi murni (tanpa I/O). Dipakai server GAS & klien → hasil identik.
 * Semua rumus didokumentasikan; diuji di tests (runSelfTests / node).
 * ========================================================================== */
var CALC = (function () {
  var R = 6378137; // radius WGS84 (m)
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function round(v, d) { var p = Math.pow(10, d == null ? 2 : d); return Math.round(num(v) * p) / p; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { d = (d instanceof Date) ? d : new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function toDate(s) { if (!s) return null; if (s instanceof Date) return s; var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s); }
  function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
  function addDays(d, n) { var x = toDate(d); x = new Date(x.getTime()); x.setDate(x.getDate() + n); return x; }
  function weekStart(d) { var x = toDate(d); var wd = (x.getDay() + 6) % 7; return ymd(addDays(x, -wd)); } // Senin
  function monthStart(d) { var x = toDate(d); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-01'; }

  /* ---------- RAB ----------
   * Total_i = Volume_i × HargaSatuan_i
   * Subtotal = Σ Total_i ; Cadangan = Subtotal × c% ; Pajak = (Subtotal + Cadangan) × t%
   * RAB = Subtotal + Cadangan + Pajak. Cadangan = alokasi risiko, BUKAN biaya terealisasi. */
  function rabTotals(items, contingencyPct, taxPct) {
    var sub = 0, groups = {};
    (items || []).forEach(function (it) {
      var t = num(it.volume) * num(it.unit_price); sub += t;
      var g = it.group_code || 'Lainnya'; groups[g] = (groups[g] || 0) + t;
    });
    var cont = sub * num(contingencyPct) / 100, tax = (sub + cont) * num(taxPct) / 100;
    return { subtotal: round(sub, 0), contingency: round(cont, 0), tax: round(tax, 0), grand: round(sub + cont + tax, 0), groups: groups };
  }

  /* ---------- Progres tertimbang ----------
   * Progress = Σ(Bobot_i × Progres_i) / Σ Bobot_i  (dinormalisasi bila Σ bobot ≠ 100) */
  function weightedProgress(tasks, type) {
    var w = 0, s = 0;
    (tasks || []).forEach(function (t) {
      if (type && (t.progress_type || 'PHYSICAL') !== type) return;
      var wi = num(t.weight_pct); w += wi; s += wi * Math.min(100, Math.max(0, num(t.progress_pct)));

  }

    var w = 0, s = 0, d = toDate(date);

  }

  /* ---------- Earned Value ---------- */
  function evm(bac, plannedPct, actualPct, actualCost) {

  terms: ['Syarat & Ketentuan', '<p class="sm muted">Berlaku sejak 14 November 2026 · ' + APP_META.name + ' v' + APP_META.version + '</p><h4>1. Ruang lingkup</h4><p>' + APP_META.name + ' adalah perangkat lunak manajemen proyek survei foto udara yang dipasang pada akun Google milik Pelanggan (Google Apps Script + Google Sheets/Drive). Penyedia memberikan lisensi penggunaan, bukan kepemilikan kode.</p><h4>2. Lisensi</h4><ul><li>Lisensi bersifat non-eksklusif, tidak dapat dialihkan, untuk jumlah pengguna/proyek sesuai paket.</li><li>Dilarang menjual ulang, menyewakan, atau mendistribusikan ulang aplikasi tanpa izin tertulis penyedia.</li><li>Dilarang menghapus atau mengakali mekanisme lisensi.</li></ul><h4>3. Tanggung jawab operasional</h4><ul><li>Keputusan terbang, keselamatan, dan kepatuhan regulasi penerbangan (registrasi, sertifikat pilot, persetujuan terbang, ruang udara) sepenuhnya tanggung jawab operator/pilot. Compliance gate adalah alat bantu, bukan izin.</li><li>Hasil perhitungan (GSD, overlap, RMSE, RAB, progres) bergantung pada data masukan dan wajib diverifikasi tenaga ahli.</li><li>Integrasi software fotogrametri pihak ketiga tunduk pada lisensi software tersebut; aplikasi tidak menyertakan lisensinya.</li><li>Keluaran AI adalah draf berbasis data sistem dan wajib ditinjau manusia sebelum dipakai.</li></ul><h4>4. Data</h4><p>Data Pelanggan disimpan di akun Google Pelanggan. Pelanggan bertanggung jawab atas izin pengumpulan data (termasuk foto udara yang memuat orang/properti) dan klasifikasi data geospasial sesuai UU No. 4/2011 tentang Informasi Geospasial.</p><h4>5. Ketersediaan & batasan</h4><p>Layanan bergantung pada kuota dan ketersediaan Google Apps Script. Penyedia tidak menjamin bebas gangguan. Batas sel Google Sheets (10 juta) dan sel 50.000 karakter dikelola otomatis tetapi tetap berlaku.</p><h4>6. Batasan tanggung jawab</h4><p>Sejauh diizinkan hukum, tanggung jawab penyedia terbatas pada biaya lisensi yang dibayar 12 bulan terakhir. Penyedia tidak bertanggung jawab atas kerugian tidak langsung, kehilangan data akibat tindakan Pelanggan, atau insiden penerbangan.</p><h4>7. Hukum yang berlaku</h4><p>Tunduk pada hukum Republik Indonesia. Sengketa diselesaikan musyawarah, lalu melalui pengadilan negeri domisili penyedia.</p>'],
  privacy: ['Pemberitahuan Privasi', '<p class="sm muted">Mengacu pada UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi (UU PDP).</p><h4>Pengendali data</h4><p>Organisasi pengguna aplikasi ini adalah Pengendali Data. Penyedia perangkat lunak bertindak sebagai pemroses hanya bila diberi akses dukungan.</p><h4>Data yang diproses</h4><ul><li>Akun: nama, email, nomor WhatsApp, jabatan, peran, foto profil (opsional), waktu login.</li><li>Keamanan: hash password (PBKDF2), status MFA, log audit (aksi, waktu, perangkat).</li><li>Operasional: data proyek, lokasi survei, koordinat GCP/CP, metadata foto (termasuk lokasi GPS), dokumentasi lapangan, keuangan proyek.</li></ul><h4>Tujuan & dasar</h4><p>Pelaksanaan kontrak pekerjaan survei, kewajiban hukum (keselamatan penerbangan, perpajakan), dan kepentingan sah (keamanan sistem, audit).</p><h4>Penyimpanan & keamanan</h4><p>Data disimpan di Google Sheets/Drive milik organisasi. Kontrol: RBAC, isolasi organisasi, MFA, enkripsi transit (HTTPS), rate limiting, audit trail, backup harian. Data offline di perangkat disimpan di IndexedDB browser dan dihapus saat logout.</p><h4>Pihak ketiga (bila diaktifkan admin)</h4><ul><li>Google (hosting). Fonnte (WhatsApp). Open-Meteo (cuaca, hanya koordinat). Provider AI pilihan admin (ringkasan data proyek tanpa password).</li></ul><h4>Hak subjek data</h4><p>Anda berhak mengakses, memperbaiki, meminta penghapusan, membatasi pemrosesan, dan menarik persetujuan. Hubungi admin organisasi Anda.</p><h4>Retensi</h4><p>Data proyek disimpan selama kontrak + masa arsip yang ditetapkan organisasi. Data terhapus diarsipkan setelah 90 hari lalu dapat dimusnahkan.</p><h4>Foto udara & privasi pihak ketiga</h4><p>Operator wajib meminimalkan perekaman orang dan properti di luar AOI serta membatasi distribusi hasil yang memuat data sensitif.</p>'],
